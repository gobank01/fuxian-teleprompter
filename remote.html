<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>รีโมท — Fuxian Teleprompter</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#101012;--panel:#1a1a1f;--line:#2e2e36;--text:#e9e4d6;--dim:#93907f;--gold:#f0c75e;--green:#2ecc71;--red:#e74c3c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans Thai',sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
h1{font-size:18px;color:var(--gold)}
#pair{display:flex;flex-direction:column;gap:14px;align-items:center}
#codeIn{font-size:30px;letter-spacing:8px;text-align:center;width:260px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);font-size:20px;padding:20px;user-select:none;-webkit-user-select:none}
button:active{background:#22222c}
button.primary{background:var(--gold);color:#111;font-weight:700;font-size:18px;padding:14px 34px}
#pad{display:none;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px}
#bToggle{grid-column:1/3;font-size:26px;padding:28px;font-weight:700}
#bToggle.on{background:var(--green);color:#fff;border-color:var(--green)}
#bRestart.arming{background:#3a2a15;border-color:var(--gold)}
#status{color:var(--dim);font-size:15px;min-height:1.4em}
#status.bad{color:var(--red)}
</style>
</head>
<body>
<h1>📱 รีโมท Fuxian Teleprompter</h1>
<div id="pair">
  <div style="color:var(--dim)">ใส่รหัส 6 หลักจากหน้าจอหลัก</div>
  <input id="codeIn" inputmode="numeric" maxlength="6" placeholder="000000" autofocus>
  <button class="primary" id="bConnect">เชื่อมต่อ</button>
</div>
<div id="pad">
  <button data-c="slower">🐢 ช้าลง</button>
  <button data-c="faster">🐇 เร็วขึ้น</button>
  <button data-c="prev">⏮ ช่วงก่อน</button>
  <button data-c="next">⏭ ช่วงถัดไป</button>
  <button data-c="font-">🔡 เล็กลง</button>
  <button data-c="font+">🔠 ใหญ่ขึ้น</button>
  <button data-c="voice">🎙 ตามเสียง</button>
  <button id="bRestart">⏫ กดค้างเริ่มใหม่</button>
  <button id="bToggle">▶ เล่น</button>
</div>
<div id="status"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
let peer=null, conn=null, lastData=0, watchT=null, wakeLock=null;
$('codeIn').value = localStorage.getItem('fx_remote_code')||'';

function status(msg,bad){ $('status').textContent=msg; $('status').classList.toggle('bad',!!bad); }
async function grabWake(){ try{ wakeLock=await navigator.wakeLock.request('screen'); }catch(_){} } // กันจอมือถือดับแล้วรีโมทตาย

function connect(){
  const code=($('codeIn').value||localStorage.getItem('fx_remote_code')||'').trim();
  if(code.length!==6) return status('ใส่รหัสให้ครบ 6 หลัก',true);
  localStorage.setItem('fx_remote_code',code);
  status('กำลังเชื่อมต่อ…');
  if(peer){ try{peer.destroy()}catch(_){} }
  conn=null;
  peer=new Peer();
  peer.on('open',()=>{
    const c=peer.connect('fxtp-'+code);
    c.on('open',()=>{
      conn=c; lastData=Date.now();
      $('pair').style.display='none'; $('pad').style.display='grid';
      status('เชื่อมต่อแล้ว ✓'); grabWake();
    });
    c.on('data',d=>{
      lastData=Date.now();
      if(d.t==='state'){
        $('bToggle').textContent=d.playing?'⏸ พัก':'▶ เล่น';
        $('bToggle').classList.toggle('on',d.playing);
        document.querySelector('[data-c=voice]').style.borderColor=d.voice?'var(--green)':'var(--line)';
      }
    });
    c.on('close',()=>{ conn=null; status('หลุดการเชื่อมต่อ — กำลังต่อใหม่…',true); setTimeout(connect,2000); });
    c.on('error',()=>{ conn=null; status('หลุดการเชื่อมต่อ — กำลังต่อใหม่…',true); setTimeout(connect,2000); });
  });
  peer.on('error',e=>{
    if(e.type==='peer-unavailable') status('ไม่พบจอหลัก — เช็ครหัส/เปิดรีโมทบนจอหลักแล้วลองใหม่',true);
    else { status('ขัดข้อง ('+e.type+') — กำลังต่อใหม่…',true); setTimeout(connect,3000); }
  });
}
$('bConnect').onclick=connect;
$('codeIn').addEventListener('keydown',e=>{ if(e.key==='Enter') connect(); });

/* watchdog: จอหลักส่ง heartbeat ทุก 4 วิ — เงียบเกิน 12 วิ = สายตายเงียบ (จอมือถือเพิ่งปลดล็อก ฯลฯ) → ต่อใหม่เอง */
watchT=setInterval(()=>{
  if(conn && Date.now()-lastData>12000){ conn=null; status('สัญญาณหาย — กำลังต่อใหม่…',true); connect(); }
},3000);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){ grabWake(); if(conn && Date.now()-lastData>6000){ conn=null; connect(); } }
});

const send=c=>{ if(conn) try{conn.send({c})}catch(_){} };
$('bToggle').onclick=()=>send('toggle');
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>send(b.dataset.c));

/* เริ่มใหม่ = กดค้าง 0.8 วิ กันนิ้วโดนแล้วสคริปต์เด้งไปบนสุดกลางไลฟ์ */
let holdT=null;
const bR=$('bRestart');
const arm=()=>{ bR.classList.add('arming'); holdT=setTimeout(()=>{ send('restart'); bR.classList.remove('arming'); },800); };
const disarm=()=>{ bR.classList.remove('arming'); clearTimeout(holdT); };
bR.addEventListener('pointerdown',arm);
['pointerup','pointerleave','pointercancel'].forEach(ev=>bR.addEventListener(ev,disarm));
</script>
</body>
</html>
